services:
  postgres-primary:
    image: postgres:16
    container_name: webhook_postgres_primary
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webhook
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c listen_addresses='*'
    volumes:
      - webhook_pg_primary_data:/var/lib/postgresql/data
      - ./docker/primary-init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhook"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-replica:
    image: postgres:16
    container_name: webhook_postgres_replica
    ports:
      - "5433:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: replicator
    user: postgres
    command: >
      bash -c "
      if [ ! -f \"$$PGDATA/PG_VERSION\" ]; then
        until pg_basebackup --host=postgres-primary --port=5432 --username=replicator --no-password --pgdata=\"$$PGDATA\" --wal-method=stream --write-recovery-conf --progress; do
          echo 'Waiting for primary to be ready...';
          sleep 2;
        done;
        chmod 700 \"$$PGDATA\";
      fi;
      exec postgres -c hot_standby=on
      "
    volumes:
      - webhook_pg_replica_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  webhook_pg_primary_data:
  webhook_pg_replica_data:
